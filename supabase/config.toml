# Local development configuration for the Supabase CLI.
#
#   supabase start     boots Postgres, Auth, the API and Studio in Docker
#   supabase db reset  re-applies every migration from scratch
#   supabase test db   runs the pgTAP tests in supabase/tests
#
# The hosted project is configured in the Supabase dashboard; this file only
# affects the local stack.

project_id = "verba"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
# The curated vocabulary ships as a migration, so a hosted project is fully
# populated by `supabase db push` alone. There is no separate seed step.
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
# Catches confirmation and reset emails locally at http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only. Turn confirmations ON in production.
enable_confirmations = false
secure_password_change = true

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false
